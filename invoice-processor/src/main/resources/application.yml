spring:
  application:
    name: invoice-processor
  # Same as pr-reviewer: outside Docker, read secrets from the repo-root .env
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  threads:
    virtual:
      enabled: true

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      model-name: ${OPENAI_MODEL:gpt-4o-mini}
      temperature: 0.0
      response-format: json_schema
      strict-json-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
